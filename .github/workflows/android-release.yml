name: Build IP-NET Hosting APK

on:
  push:
    tags:
      - 'ipnet-hosting-v*'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build installable APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Verify APK and prepare release file
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#ipnet-hosting-v}"
          APK="IP-NET-Hosting-${VERSION}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"
          echo "APK_FILE=$APK" >> "$GITHUB_ENV"
          sha256sum "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: IP-NET-Hosting-APK
          path: ${{ env.APK_FILE }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          name: IP-NET Hosting ${{ github.ref_name }}
          generate_release_notes: true
          files: ${{ env.APK_FILE }}
