name: Build IP-NET Hosting APK

on:
  push:
    branches:
      - qgs-ipnet-rebrand
    tags:
      - 'ipnet-hosting-v*'

permissions:
  contents: write

jobs:
  build-apk:
    if: startsWith(github.ref, 'refs/tags/ipnet-hosting-v') || contains(github.event.head_commit.message, '[build-apk]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build installable APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Verify APK and prepare release file
        shell: bash
        run: |
          VERSION="1.0.0"
          APK="IP-NET-Hosting-${VERSION}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          BADGING="$("$AAPT" dump badging "$APK")"
          grep -F "package: name='ro.ipnet.hosting' versionCode='1' versionName='1.0.0'" <<< "$BADGING"
          grep -F "application-label:'IP-NET Hosting'" <<< "$BADGING"
          echo "APK_FILE=$APK" >> "$GITHUB_ENV"
          sha256sum "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: IP-NET-Hosting-APK
          path: ${{ env.APK_FILE }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ipnet-hosting-v1.0.0
          target_commitish: ${{ github.sha }}
          name: IP-NET Hosting 1.0.0
          generate_release_notes: true
          files: ${{ env.APK_FILE }}
