name: IP-NET Hosting validation and final APK release

on:
  push:
    branches: [ qgs-ipnet-rebrand ]
    paths:
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - 'gradle.properties'
      - 'app/**'
      - '.github/workflows/native-check.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile-source-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '12266719'
          accept-android-sdk-licenses: true
          packages: 'platform-tools platforms;android-35'
      - name: Compile Kotlin source only (no APK packaging)
        run: gradle :app:compileDebugKotlin --no-daemon
  build-final-apk:
    if: contains(github.event.head_commit.message, '[build-apk]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '12266719'
          accept-android-sdk-licenses: true
          packages: 'platform-tools platforms;android-35'

      - name: Build installable APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Verify APK identity and signature
        shell: bash
        run: |
          VERSION="1.0.0"
          APK="IP-NET-Hosting-${VERSION}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          test -n "$AAPT"
          "$APKSIGNER" verify --verbose "$APK"
          BADGING="$("$AAPT" dump badging "$APK")"
          grep -F "package: name='ro.ipnet.hosting' versionCode='1' versionName='1.0.0'" <<< "$BADGING"
          grep -F "application-label:'IP-NET Hosting'" <<< "$BADGING"
          echo "APK_FILE=$APK" >> "$GITHUB_ENV"
          sha256sum "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: IP-NET-Hosting-APK
          path: ${{ env.APK_FILE }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ipnet-hosting-v1.0.0
          target_commitish: ${{ github.sha }}
          name: IP-NET Hosting 1.0.0
          generate_release_notes: true
          files: ${{ env.APK_FILE }}

