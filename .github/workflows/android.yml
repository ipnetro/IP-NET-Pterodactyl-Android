name: Build QGS-based IP-NET Hosting APK

on:
  push:
    branches: [ qgs-ipnet-rebrand ]
    paths:
      - '.github/workflows/android.yml'
      - 'qgs-ipnet-modified-source.zip'
      - 'ipnet_hosting_logo.png'
      - 'scripts/**'
      - 'qgs-ipnet-rebrand/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-qgs-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK command-line tools
        run: |
          set -eu
          export ANDROID_HOME="$RUNNER_TEMP/android-sdk"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fL --retry 3 https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip -o "$RUNNER_TEMP/android-cmdline-tools.zip"
          unzip -q "$RUNNER_TEMP/android-cmdline-tools.zip" -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" "platform-tools" "build-tools;36.0.0"
          test -x "$ANDROID_HOME/build-tools/36.0.0/zipalign"
          test -x "$ANDROID_HOME/build-tools/36.0.0/apksigner"

      - name: Install Apktool 3.0.3
        run: |
          curl -fL --retry 3 https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar -o "$RUNNER_TEMP/apktool.jar"
          printf '#!/usr/bin/env bash\nexec java -jar "$RUNNER_TEMP/apktool.jar" "$@"\n' > "$RUNNER_TEMP/apktool"
          chmod +x "$RUNNER_TEMP/apktool"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/apktool" --version

      - name: Extract QGS modified source
        run: |
          test -f qgs-ipnet-modified-source.zip
          unzip -q qgs-ipnet-modified-source.zip -d "$RUNNER_TEMP/qgs-src"
          test -f "$RUNNER_TEMP/qgs-src/qgs-ipnet-modified/AndroidManifest.xml"
          # Convert the extracted base APK into a standalone installable APK.
          python3 - <<'PY'
          from pathlib import Path
          p = Path(__import__("os").environ["RUNNER_TEMP"]) / "qgs-src/qgs-ipnet-modified/AndroidManifest.xml"
          s = p.read_text()
          s = s.replace(' android:requiredSplitTypes="base__density"', '')
          s = s.replace(' android:splitTypes=""', '')
          p.write_text(s)
          PY

      - name: Rebrand Android package identity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os, re
          p = Path(os.environ["RUNNER_TEMP"]) / "qgs-src/qgs-ipnet-modified/AndroidManifest.xml"
          s = p.read_text(encoding="utf-8")
          # Keep the original QGS activity/class names, but give this app a
          # distinct Android package so Android installs it alongside QGS.
          s = re.sub(r'(?<=package=")qgs\.hosting\.com(?=")', 'ro.ipnet.hosting', s)
          s = s.replace('qgs.hosting.com.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION',
                        'ro.ipnet.hosting.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION')
          s = s.replace('qgs.hosting.com.androidx-startup',
                        'ro.ipnet.hosting.androidx-startup')
          if 'package="ro.ipnet.hosting"' not in s:
              raise SystemExit("Package identity was not updated; refusing to build")
          p.write_text(s, encoding="utf-8")
          print("Manifest package:", re.search(r'package="([^"]+)"', s).group(1))
          PY
      - name: Verify IP-NET app identity and panel target
        run: |
          set -eu
          SRC="$RUNNER_TEMP/qgs-src/qgs-ipnet-modified"
          test -f "$SRC/smali/com/qgs/hosting/MainActivity.smali"
          grep -Fq 'https://ptero.ip-net.ro' "$SRC/smali/com/qgs/hosting/MainActivity.smali"
          grep -Fq 'package="ro.ipnet.hosting"' "$SRC/AndroidManifest.xml"
          grep -Fq '<string name="app_name">IP-NET Hosting</string>' "$SRC/res/values/strings.xml"
          echo 'Verified: original QGS Android shell, IP-NET package/name, and Pterodactyl panel URL.'

      - name: Inspect QGS resources before rebranding
        run: python3 scripts/inspect_qgs_source.py
      - name: Upload QGS source inspection
        uses: actions/upload-artifact@v4
        with:
          name: QGS-source-inspection
          path: ${{ runner.temp }}/qgs-inspection/
          if-no-files-found: error
          retention-days: 7

      - name: Build unsigned APK
        run: |
          apktool b "$RUNNER_TEMP/qgs-src/qgs-ipnet-modified" -o "$RUNNER_TEMP/IP-NET-Hosting-unsigned.apk"

      - name: Align and sign APK
        run: |
          BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          test -x "$BUILD_TOOLS/zipalign"
          test -x "$BUILD_TOOLS/apksigner"
          "$BUILD_TOOLS/zipalign" -f -v 4 "$RUNNER_TEMP/IP-NET-Hosting-unsigned.apk" "$RUNNER_TEMP/IP-NET-Hosting-aligned.apk"
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/ipnet-debug.keystore" -storepass android -keypass android -alias ipnet -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=IP-NET Hosting, OU=Android, O=IP-NET, L=Antwerp, ST=Antwerp, C=BE"
          "$BUILD_TOOLS/apksigner" sign --ks "$RUNNER_TEMP/ipnet-debug.keystore" --ks-pass pass:android --key-pass pass:android --out "$RUNNER_TEMP/IP-NET-Hosting-debug.apk" "$RUNNER_TEMP/IP-NET-Hosting-aligned.apk"
          "$BUILD_TOOLS/apksigner" verify --verbose "$RUNNER_TEMP/IP-NET-Hosting-debug.apk"
          "$BUILD_TOOLS/aapt" dump badging "$RUNNER_TEMP/IP-NET-Hosting-debug.apk" | head -n 5

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: IP-NET-Hosting-QGS-debug
          path: ${{ runner.temp }}/IP-NET-Hosting-debug.apk
          if-no-files-found: error
          retention-days: 30
